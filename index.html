<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signCollect - Motion Capture Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .portal-logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .portal-logo i {
            font-size: 48px;
            color: #0f3460;
            margin-bottom: 12px;
        }
        .portal-logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin: 8px 0 4px;
        }
        .portal-logo p {
            color: #6c757d;
            font-size: 14px;
            margin: 0;
        }
        .site-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
            color: #1a1a2e;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            margin-bottom: 14px;
        }
        .site-btn:hover {
            border-color: #0f3460;
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 52, 96, 0.3);
        }
        .site-btn:hover .btn-icon {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .site-btn:hover .btn-desc {
            color: rgba(255, 255, 255, 0.7);
        }
        .site-btn:active {
            transform: translateY(0);
        }
        .btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(15, 52, 96, 0.08);
            color: #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-text {
            margin-left: 16px;
            text-align: left;
        }
        .btn-title {
            display: block;
            line-height: 1.3;
        }
        .btn-desc {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: #6c757d;
            margin-top: 2px;
            transition: color 0.2s;
        }
        .divider {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 24px 0;
        }
        .footer-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<div>
    <div class="portal-card">
        <div class="portal-logo">
            <i class="fas fa-hands-asl-interpreting"></i>
            <h1>signCollect</h1>
            <p>Motion Capture Portal</p>
        </div>

        <a href="https://signcollect.nl/animMIDI/public/index.php" class="site-btn">
            <div class="btn-icon"><i class="fas fa-file-video"></i></div>
            <div class="btn-text">
                <span class="btn-title">Motion Capture File Manager</span>
                <span class="btn-desc">PostProcessing beheer</span>
            </div>
        </a>

        <a href="https://signcollect.nl/mocapStudio/3dOpname_test.html" class="site-btn">
            <div class="btn-icon"><i class="fas fa-cube"></i></div>
            <div class="btn-text">
                <span class="btn-title">3D Studio Capture Site</span>
                <span class="btn-desc">Live capture sessies</span>
            </div>
        </a>

        <a href="https://avatar.signcollect.nl/blendAnims/" class="site-btn">
            <div class="btn-icon"><i class="fas fa-person-walking"></i></div>
            <div class="btn-text">
                <span class="btn-title">signCollect Avatar Player</span>
                <span class="btn-desc">Avatar animatie player</span>
            </div>
        </a>

        <hr class="divider">

        <a href="https://signcollect.nl/viconDashboard/" class="site-btn">
            <div class="btn-icon"><i class="fas fa-sync-alt"></i></div>
            <div class="btn-text">
                <span class="btn-title">Vicon Dashboard Sync</span>
                <span class="btn-desc">Dashboard synchronisatie</span>
            </div>
        </a>
    </div>
    <p class="footer-text">signCollect &copy; 2026</p>
</div>

<script>
    (function() {
        var cookies = decodeURIComponent(document.cookie);
        var sessionCookie = cookies.split('; ').find(function(row) { return row.startsWith('sessionObject='); });
        var sessionData = null;
        if (sessionCookie) {
            try {
                var parsed = JSON.parse(sessionCookie.split('=')[1]);
                if (parsed.userId) sessionData = parsed;
            } catch (e) {}
        }
        if (!sessionData) {
            window.location.href = 'https://signcollect.nl/login.html?redirect=' + encodeURIComponent(window.location.href);
            return;
        }
        var page = location.host + (location.pathname || '/');
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://signcollect.nl/users_api.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.send('action=activity&userId=' + encodeURIComponent(sessionData.userId) + '&page=' + encodeURIComponent(page));
    })();
</script>
</body>
</html>
